groups:
  - name: agendai-api
    rules:
      - alert: AgendaiApiDown
        expr: up{job="agendai-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: The Agendai API cannot be scraped
          description: Prometheus has failed to scrape {{ $labels.instance }} for one minute.
      - alert: AgendaiHighServerErrorRate
        expr: sum(rate(agendai_http_requests_total{status=~"5.."}[5m])) / sum(rate(agendai_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of requests answer 5xx
          description: The share of 5xx responses has stayed above 5% for five minutes.
      - alert: AgendaiSlowRoute
        expr: histogram_quantile(0.95, sum by (le, route) (rate(agendai_http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The p95 latency of {{ $labels.route }} is above one second
          description: The 95th percentile of {{ $labels.route }} has stayed above one second for ten minutes.
